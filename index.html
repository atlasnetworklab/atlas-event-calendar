<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08162d">
  <meta name="description" content="Atlas appearances and events calendar for Kerim Kfuri.">
  <title>Atlas Event Calendar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Atlas Event Calendar home">
        <img class="atlas-logo" src="assets/atlas-logo.png" alt="The Atlas Network">
        <span>
          <strong>ATLAS</strong>
          <small>EVENT CALENDAR</small>
        </span>
      </a>
      <div class="top-actions">
        <span class="team-label">ATLAS TEAM</span>
        <button class="install-button" id="installButton" type="button" hidden>Install</button>
      </div>
    </header>

    <main id="top">
      <section class="hero-ribbon" aria-labelledby="pageTitle">
        <div class="collage-strip" aria-hidden="true">
          <div class="hero-image"><img src="assets/moment-handshake.jpg" alt=""></div>
          <div class="hero-image"><img src="assets/moment-stage.jpg" alt=""></div>
          <div class="hero-image"><img src="assets/moment-vegas.jpg" alt=""></div>
          <div class="hero-image"><img src="assets/moment-call.jpg" alt=""></div>
          <div class="hero-image"><img src="assets/moment-panel.jpg" alt=""></div>
          <div class="hero-image"><img src="assets/moment-work.jpg" alt=""></div>
        </div>
        <div class="hero-wash"></div>
        <div class="hero-copy">
          <h1 id="pageTitle"><span>Every Stage.</span> <span>Every Screen.</span> <span>Every Show Floor.</span> <em>One Calendar.</em></h1>
          <p>Events, broadcasts and appearances across the Atlas network.</p>
        </div>
        <article class="next-card" id="nextUp" aria-live="polite"></article>
      </section>

      <section class="calendar-shell" aria-label="Event calendar">
        <div class="calendar-toolbar">
          <div class="month-nav" aria-label="Select month">
            <button id="previousMonth" type="button" aria-label="Previous month">‹</button>
            <div>
              <span>SELECTED MONTH</span>
              <strong id="selectedMonthLabel"></strong>
            </div>
            <button id="nextMonth" type="button" aria-label="Next month">›</button>
          </div>
          <div class="view-switch" role="group" aria-label="Calendar view">
            <button type="button" data-view="month">Month</button>
            <button type="button" data-view="list">List</button>
          </div>
          <div class="filter-region">
            <div class="filter-chips" id="filterChips" aria-label="Filter by category"></div>
            <div class="legend" id="legend" aria-label="Category legend"></div>
          </div>
        </div>

        <div id="calendarContent"></div>
      </section>
    </main>

    <footer>
      <span>ATLAS · INTERNAL WORKING CALENDAR</span>
      <span id="todayLabel"></span>
    </footer>
  </div>

  <dialog class="detail-dialog" id="detailDialog" aria-labelledby="detailTitle">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="Close details">×</button>
    <div id="detailContent"></div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
